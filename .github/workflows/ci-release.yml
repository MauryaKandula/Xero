name: XERO CI & Release Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Build portable ZIP release
        run: npm run package

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: XERO-Desktop-Suite
          path: release/XERO-Desktop-Suite.zip

      - name: Attach zip to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/XERO-Desktop-Suite.zip
